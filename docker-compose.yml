services:
  # -------------------------
  # Database & Cache
  # -------------------------
  db:
    image: mariadb:10.11
    container_name: rictms_db
    networks:
      - app_network
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: admin
      TZ: Asia/Manila
    ports:
      - "3307:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  redis:
    image: redis:7-alpine
    container_name: rictms_redis
    networks:
      - app_network
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------
  # Microservices
  # -------------------------
  users-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_users_service
    networks:
      - app_network
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/apps/users-service.main.js"]
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Manila
      - DB_HOST=db
      - DB_PASSWORD=admin
      - DB_BOOTSTRAP=false
      - REDIS_HOST=redis
    ports:
      - "4101:4101"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4101/api/docs').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  ticketing-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_ticketing_service
    networks:
      - app_network
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      users-service:
        condition: service_healthy
    command: ["node", "dist/apps/ticketing-service.main.js"]
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Manila
      - DB_HOST=db
      - DB_PASSWORD=admin
      - DB_BOOTSTRAP=false
      - REDIS_HOST=redis
      - USERS_SERVICE_URL=http://users-service:4101
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - COMMENT_ATTACHMENT_STORAGE_ROOT=/app/uploads/comments
      - ESCALATION_STORAGE_ROOT=/app/uploads/escalations
    ports:
      - "4102:4102"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4102/api/docs').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 35s
    volumes:
      - ticketing_uploads:/app/uploads

  compliance-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_compliance_service
    networks:
      - app_network
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      users-service:
        condition: service_healthy
    command: ["node", "dist/apps/compliance-service.main.js"]
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Manila
      - DB_HOST=db
      - DB_PASSWORD=admin
      - DB_BOOTSTRAP=false
      - REDIS_HOST=redis
      - USERS_SERVICE_URL=http://users-service:4101
    ports:
      - "4103:4103"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4103/api/docs').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 35s

  # -------------------------
  # API Gateway
  # -------------------------
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_gateway
    networks:
      - app_network
    restart: on-failure
    depends_on:
      users-service:
        condition: service_healthy
      ticketing-service:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    command: ["node", "dist/apps/gateway.main.js"]
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Manila
      - DB_HOST=db
      - DB_PASSWORD=admin
      - USERS_SERVICE_URL=http://users-service:4101
      - TICKETING_SERVICE_URL=http://ticketing-service:4102
      - COMPLIANCE_SERVICE_URL=http://compliance-service:4103
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=4000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://0.0.0.0:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  # -------------------------
  # Frontend
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-907503372813-5393jo7p27hhbq0ih49tjm0gknr01it4.apps.googleusercontent.com}
        - VITE_PROFILE_IMAGE_URL=${VITE_PROFILE_IMAGE_URL}
    container_name: rictms_frontend
    networks:
      - app_network
    restart: on-failure
    environment:
      - TZ=Asia/Manila
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  db_data:
  redis_data:
  ticketing_uploads:

networks:
  app_network:
    enable_ipv6: false

