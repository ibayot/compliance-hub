version: '3.8'

services:
  # -------------------------
  # Database & Cache
  # -------------------------
  db:
    image: mariadb:10.11
    container_name: rictms_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: rictms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # -------------------------
  # Microservices
  # -------------------------
  users-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_users_service
    restart: on-failure
    depends_on:
      - db
      - redis
    command: ["node", "dist/apps/users-service.main.js"]
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "4101:4101"

  ticketing-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_ticketing_service
    restart: on-failure
    depends_on:
      - db
      - redis
    command: ["node", "dist/apps/ticketing-service.main.js"]
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "4102:4102"

  compliance-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_compliance_service
    restart: on-failure
    depends_on:
      - db
      - redis
    command: ["node", "dist/apps/compliance-service.main.js"]
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "4103:4103"

  # -------------------------
  # API Gateway
  # -------------------------
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_gateway
    restart: on-failure
    depends_on:
      - users-service
      - ticketing-service
      - compliance-service
    command: ["node", "dist/apps/gateway.main.js"]
    env_file:
      - ./backend/.env
    environment:
      - USERS_SERVICE_URL=http://users-service:4101
      - TICKETING_SERVICE_URL=http://ticketing-service:4102
      - COMPLIANCE_SERVICE_URL=http://compliance-service:4103
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=4000
    ports:
      - "4000:4000"

  # -------------------------
  # Frontend
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rictms_frontend
    restart: on-failure
    depends_on:
      - gateway
    ports:
      - "3000:80"

volumes:
  db_data:
  redis_data:
