<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compliance Hub</title>
    <link rel="icon" type="image/png" href="/icons/compliance-hub-ios.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/compliance-hub-ios.png">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Compliance Hub">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="/install-ios-launch.js" defer></script>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 1.5rem; line-height: 1.55; }
      main { max-width: 28rem; margin: 2rem auto; }
      img { display: block; width: 4.5rem; height: 4.5rem; border-radius: 1rem; }
      li { margin-block: .5rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/compliance-hub-ios.png" alt="" width="180" height="180">
      <h1>Install Compliance Hub</h1>
      <ol>
        <li>In Safari, tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.</li>
        <li>Turn on <strong>Open as Web App</strong> if shown, then tap <strong>Add</strong>.</li>
        <li>Open the new icon. In the bell menu, choose <strong>Browser alerts → Enable</strong>.</li>
      </ol>
      <p><a href="/dashboard">Open Compliance Hub</a></p>
    </main>
  </body>
</html>
