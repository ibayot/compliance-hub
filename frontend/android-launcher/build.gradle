import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application' version '8.13.0'
    id 'com.google.gms.google-services' version '4.6.0'
}

def origin = providers.environmentVariable('HUB_ANDROID_ORIGIN').get()
def webManifest = new JsonSlurper().parse(file('../public/manifest.webmanifest'))
def assetStatements = JsonOutput.toJson([[
    relation: ['delegate_permission/common.handle_all_urls'],
    target: [namespace: 'web', site: origin]
]]).replace('"', '\\"')

def generatedResources = layout.buildDirectory.dir('generated/hubResources')
def generatedSounds = layout.buildDirectory.dir('generated/hubSounds')
def copyLauncherIcon = tasks.register('copyLauncherIcon', Copy) {
    from('../public/icons/app-192.png')
    into(generatedResources.map { it.dir('drawable-nodpi') })
    rename { 'hub_launcher.png' }
}
def copyRootCertificate = tasks.register('copyRootCertificate', Copy) {
    from('../../backend/assets/compliance-hub-root-ca.crt')
    into(generatedResources.map { it.dir('raw') })
    rename { 'compliance_hub_root_ca.crt' }
}
def copyNotificationSounds = tasks.register('copyNotificationSounds', Copy) {
    from('../public/sounds')
    include('routine_notification.wav', 'nearing_sla.wav', 'overdue_sla.wav')
    into(generatedSounds.map { it.dir('raw') })
}

android {
    namespace = 'com.dswd.fo2icare.launcher'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.dswd.fo2icare.launcher'
        minSdk = 24
        targetSdk = 36
        // The downloadable launcher can be updated independently of the web app.
        versionCode = 10117
        versionName = '1.1.13'
        resValue 'string', 'hub_app_name', webManifest.short_name
        resValue 'string', 'hub_launch_url', origin + webManifest.start_url
        resValue 'string', 'hub_asset_statements', assetStatements
        resValue 'string', 'fo2_icare_notification_channel_id', 'fo2_icare_alerts'
        resValue 'string', 'fo2_icare_notification_channel_name', 'FO2 iCare Alerts'
        resValue 'color', 'fo2_icare_notification_color', '#147A76'
    }

    sourceSets.main.res.srcDir(generatedResources)
    sourceSets.main.res.srcDir(generatedSounds)
    androidResources {
        noCompress += ['wav']
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

tasks.named('preBuild').configure { dependsOn(copyLauncherIcon, copyRootCertificate, copyNotificationSounds) }

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-installations'
}
