import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application' version '8.13.0'
}

def origin = providers.environmentVariable('HUB_ANDROID_ORIGIN').get()
def webManifest = new JsonSlurper().parse(file('../public/manifest.webmanifest'))
def appVersion = new JsonSlurper().parse(file('../package.json')).version
def versionParts = appVersion.tokenize('.').collect { it.toInteger() }
def assetStatements = JsonOutput.toJson([[
    relation: ['delegate_permission/common.handle_all_urls'],
    target: [namespace: 'web', site: origin]
]]).replace('"', '\\"')

def generatedResources = layout.buildDirectory.dir('generated/hubResources')
def copyLauncherIcon = tasks.register('copyLauncherIcon', Copy) {
    from('../public/icons/app-192.png')
    into(generatedResources.map { it.dir('drawable-nodpi') })
    rename { 'hub_launcher.png' }
}

android {
    namespace = 'com.dswd.compliancehub.launcher'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.dswd.compliancehub.launcher'
        minSdk = 24
        targetSdk = 36
        versionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName = appVersion
        resValue 'string', 'hub_launch_url', origin + webManifest.start_url
        resValue 'string', 'hub_asset_statements', assetStatements
    }

    sourceSets.main.res.srcDir(generatedResources)
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

tasks.named('preBuild').configure { dependsOn(copyLauncherIcon) }

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
