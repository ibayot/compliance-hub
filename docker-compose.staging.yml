# STAGING DEPLOYMENT CONFIGURATION
# -------------------------------------------------------------------------------------
# This file is for SERVER A (Hosting the API Gateway, Frontend, Backend Microservices).
# It relies on Server B for the Database (MariaDB).
#
# INSTRUCTIONS for targetted edits:
# Search for the "TODO" keyword below to find exactly where you need to input:
#  1. <SERVER_A_IP> - The actual IP Address or domain pointing to Server A.
#  2. <SERVER_B_IP> - The actual IP Address pointing to Server B (Database Server).
#  3. <DB_PASSWORD> - Your production database root password.
#  4. <EMAIL_APP_PASSWORD> - Your SMTP app password for sending emails.
#  5. <JWT_SECRETS> - Generate completely random strings for JWT tokens.
# -------------------------------------------------------------------------------------

x-common-env: &common-env
  # Application Core
  NODE_ENV: production
  PORT: 4000
  # TODO: Replace with Server A's IP
  APP_URL: http://<SERVER_A_IP>:4000
  FRONTEND_URL: http://<SERVER_A_IP>
  CORS_ORIGIN: http://<SERVER_A_IP>

  # Database Connection
  # TODO: Replace with Server B's routable IP or DNS hostname (do not use localhost)
  DB_HOST: <SERVER_B_IP>
  DB_PORT: 3306
  DB_USERNAME: root
  # TODO: Replace with the actual database root password
  DB_PASSWORD: <DB_PASSWORD>
  
  DB_DATABASE: 02_db_stg_compliance_hub_ticketing
  USERS_DB_DATABASE: 02_db_stg_compliance_hub_users
  TICKETING_DB_DATABASE: 02_db_stg_compliance_hub_ticketing
  COMPLIANCE_DB_DATABASE: 02_db_stg_compliance_hub
  DB_SYNCHRONIZE: "true"

  # JWT & Security Secrets
  # TODO: Generate secure random strings for these two
  JWT_SECRET: <JWT_SECRET>
  JWT_REFRESH_SECRET: <JWT_REFRESH_SECRET>
  JWT_EXPIRATION: 30m
  JWT_REFRESH_EXPIRATION: 7d
  JWT_ISSUER: compliance-hub-api
  JWT_AUDIENCE: compliance-hub-client

  # Internal Service communication secrets (can be left as-is for staging)
  INTERNAL_SERVICE_SECRET: secure-internal-secret-staging
  INTERNAL_SERVICE_TOKEN: secure-internal-secret-staging
  INTERNAL_SERVICE_TOKENS: '{"ticketing-service":"secure-internal-ticket-token","compliance-service":"secure-internal-compliance-token","api-gateway":"secure-internal-gateway-token","users-service":"secure-internal-users-token"}'

  # External Services & Redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  STORAGE_TYPE: local
  STORAGE_PATH: ./storage

  MAX_FILE_SIZE: 52428800
  ALLOWED_MIME_TYPES: application/vnd.openxmlformats-officedocument.wordprocessingml.document
  LIBREOFFICE_PATH: /usr/bin/soffice
  RATE_LIMIT_MAX_REQUESTS: 100000

  # SMTP Email Settings
  EMAIL_ENABLED: "true"
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: 465
  SMTP_USER: icts.fo2@dswd.gov.ph
  # TODO: Replace with your actual Google App Password
  SMTP_PASS: <EMAIL_APP_PASSWORD>
  SMTP_FROM: fo2.compliancehub@rictms.gov.ph

  # Google OAuth Configuration
  GOOGLE_CLIENT_ID: 907503372813-5393jo7p27hhbq0ih49tjm0gknr01it4.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: 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
  # TODO: Replace with Server A's IP for the google callback
  GOOGLE_CALLBACK_URL: http://<SERVER_A_IP>:4000/api/auth/google/callback


services:
  redis:
    image: redis:7-alpine
    container_name: rictms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  users-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_users_service
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "dist/apps/users-service.main.js"]
    environment:
      <<: *common-env
    ports:
      - "4101:4101"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4101/api/docs').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  ticketing-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_ticketing_service
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      users-service:
        condition: service_healthy
    command: ["node", "dist/apps/ticketing-service.main.js"]
    environment:
      <<: *common-env
      USERS_SERVICE_URL: http://users-service:4101
    ports:
      - "4102:4102"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4102/api/docs').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 35s

  compliance-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_compliance_service
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      users-service:
        condition: service_healthy
    command: ["node", "dist/apps/compliance-service.main.js"]
    environment:
      <<: *common-env
      USERS_SERVICE_URL: http://users-service:4101
    ports:
      - "4103:4103"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4103/api/docs').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 35s

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_gateway
    restart: on-failure
    depends_on:
      users-service:
        condition: service_healthy
      ticketing-service:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    command: ["node", "dist/apps/gateway.main.js"]
    environment:
      <<: *common-env
      USERS_SERVICE_URL: http://users-service:4101
      TICKETING_SERVICE_URL: http://ticketing-service:4102
      COMPLIANCE_SERVICE_URL: http://compliance-service:4103
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rictms_frontend
    restart: on-failure
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  redis_data:
