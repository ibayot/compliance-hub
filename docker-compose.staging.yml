# STAGING DEPLOYMENT CONFIGURATION
# -------------------------------------------------------------------------------------
# This file is for SERVER A (Hosting the API Gateway, Frontend, Backend Microservices).
# It relies on Server B for the Database (MariaDB).
#
# INSTRUCTIONS for targetted edits:
# Search for the "TODO" keyword below to find exactly where you need to input:
#  1. <SERVER_A_IP> - The actual IP Address or domain pointing to Server A.
#  2. <SERVER_B_IP> - The actual IP Address pointing to Server B (Database Server).
#  3. <DB_PASSWORD> - Your production database root password.
#  4. <EMAIL_APP_PASSWORD> - Your SMTP app password for sending emails.
#  5. <JWT_SECRETS> - Generate completely random strings for JWT tokens.
# -------------------------------------------------------------------------------------

x-common-env: &common-env
  # Application Core
  NODE_ENV: production
  PORT: 4000
  # TODO: Replace with Server A's IP
  APP_URL: http://172.31.16.76:4000
  FRONTEND_URL: http://172.31.16.76
  CORS_ORIGIN: http://172.31.16.76

  # Database Connection
  # TODO: Replace with Server B's routable IP or DNS hostname (do not use localhost)
  DB_HOST: "xxxxx -> placeholder"
  DB_PORT: "xxxxx -> placeholder"
  DB_USERNAME: "xxxxx -> placeholder"
  # TODO: Replace with the actual database root password
  DB_PASSWORD: "xxxxx -> placeholder"
  
  DB_DATABASE: "xxxxx -> placeholder"
  USERS_DB_DATABASE: "xxxxx -> placeholder"
  TICKETING_DB_DATABASE: "xxxxx -> placeholder"
  COMPLIANCE_DB_DATABASE: "xxxxx -> placeholder"
  DB_SYNCHRONIZE: "false"
  DB_BOOTSTRAP: "false"

  # JWT & Security Secrets
  # TODO: Generate secure random strings for these two
  JWT_SECRET: "xxxxx -> placeholder"
  JWT_REFRESH_SECRET: "xxxxx -> placeholder"
  JWT_EXPIRATION: 30m
  JWT_REFRESH_EXPIRATION: 7d
  JWT_ISSUER: compliance-hub-api
  JWT_AUDIENCE: compliance-hub-client

  # Replace these sample values with the Swagger credentials you will use.
  SWAGGER_USERNAME: "REPLACE_WITH_YOUR_SWAGGER_USERNAME"
  SWAGGER_PASSWORD: "REPLACE_WITH_YOUR_SWAGGER_PASSWORD"

  # Internal Service communication secrets (can be left as-is for staging)
  INTERNAL_SERVICE_SECRET: secure-internal-secret-staging
  INTERNAL_SERVICE_TOKEN: secure-internal-secret-staging
  INTERNAL_SERVICE_TOKENS: '{"ticketing-service":"secure-internal-ticket-token","compliance-service":"secure-internal-compliance-token","api-gateway":"secure-internal-gateway-token","users-service":"secure-internal-users-token"}'

  # External Services & Redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  STORAGE_TYPE: local
  STORAGE_PATH: ./storage

  MAX_FILE_SIZE: 52428800
  ALLOWED_MIME_TYPES: application/vnd.openxmlformats-officedocument.wordprocessingml.document
  LIBREOFFICE_PATH: /usr/bin/soffice
  RATE_LIMIT_MAX_REQUESTS: 100000

  # SMTP Email Settings
  EMAIL_ENABLED: "true"
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: 465
  SMTP_USER: "xxxxx -> placeholder"
  # TODO: Replace with your actual Google App Password
  SMTP_PASS: "xxxxx -> placeholder"
  SMTP_FROM: fo2.ticketing@dswd.gov.ph

  # Google OAuth Configuration
  GOOGLE_CLIENT_ID: "xxxxx -> placeholder"
  GOOGLE_CLIENT_SECRET: "xxxxx -> placeholder"
  # TODO: Replace with Server A's IP for the google callback
  GOOGLE_CALLBACK_URL: http://localhost:4000/api/auth/google/callback


services:
  redis:
    image: redis:7-alpine
    container_name: rictms_redis
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    networks:
      - app_network
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - TZ=Asia/Manila

  users-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_users_service
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    networks:
      - app_network
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "dist/apps/users-service.main.js"]
    environment:
      <<: *common-env
      TZ: Asia/Manila
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4101/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  ticketing-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_ticketing_service
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    networks:
      - app_network
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      users-service:
        condition: service_healthy
    command: ["node", "dist/apps/ticketing-service.main.js"]
    environment:
      <<: *common-env
      USERS_SERVICE_URL: http://users-service:4101
      GEMINI_API_KEY: "xxxxx -> placeholder"
      GROQ_API_KEY: "xxxxx -> placeholder"
      CEREBRAS_API_KEY: "xxxxx -> placeholder"
      COMMENT_ATTACHMENT_STORAGE_ROOT: /app/uploads/comments
      ESCALATION_STORAGE_ROOT: /app/uploads/escalations
      TZ: Asia/Manila
    volumes:
      - ticketing_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4102/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 35s

  compliance-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_compliance_service
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    networks:
      - app_network
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      users-service:
        condition: service_healthy
    command: ["node", "dist/apps/compliance-service.main.js"]
    environment:
      <<: *common-env
      USERS_SERVICE_URL: http://users-service:4101
      TZ: Asia/Manila
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4103/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 35s

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rictms_gateway
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    networks:
      - app_network
    restart: on-failure
    depends_on:
      users-service:
        condition: service_healthy
      ticketing-service:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    command: ["node", "dist/apps/gateway.main.js"]
    environment:
      <<: *common-env
      USERS_SERVICE_URL: http://users-service:4101
      TICKETING_SERVICE_URL: http://ticketing-service:4102
      COMPLIANCE_SERVICE_URL: http://compliance-service:4103
      TZ: Asia/Manila
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - "VITE_GOOGLE_CLIENT_ID=xxxxx -> placeholder"
        - "VITE_PROFILE_IMAGE_URL=xxxxx -> placeholder"
    container_name: rictms_frontend
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    networks:
      - app_network
    restart: on-failure
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    environment:
      - TZ=Asia/Manila

volumes:
  redis_data:
  ticketing_uploads:

networks:
  app_network:
    enable_ipv6: false
